whoEditor:
  title: À qui destinez-vous ce secret ?
  description: >-
    Ces personnes recevront chacune une partie du secret. 
    Elles devront se réunir pour le reconstituer. 
    Ces renseignements leur permettront de savoir qui contacter et comment.
  newRecipient: Personne non-nommée
  addRecipient: Ajouter une personne
  removeRecipient: Retirer cette personne
  addContact: Ajouter une coordonnée
  removeContact: Retirer cette coordonnée
  fields:
    name: Qui est-ce ?
    contacts: Coordonnées
    notListedPublicly: Ne pas lister publiquement
    privateInfo: Cette personne ne sera pas visible dans la liste des destinataires
    numberedInfo: Cette personne a déjà fait partie des envois et ne peut plus être retirée. Elle peut seulement être masquée de la liste des destinataires.
  placeholders:
    name: Cousin Paul Durant
    contactValue: Valeur...
    contactComment: Note...
  contactTypes:
    phone: Téléphone
    email: Email
    address: Adresse postale
    x: X (ex-Twitter)
    bluesky: Bluesky
    mastodon: Mastodon
    facebook: Facebook
    telegram: Telegram
    whatsapp: WhatsApp
    signal: Signal
    instagram: Instagram
    snapchat: Snapchat
    linkedin: LinkedIn
    web: Site web
    other: Autre
  sidePanel:
    title: Les destinataires
    collapse: Replier
    expand: Conseils
    errorTitle: Saisissez au moins deux destinataires
    unnamedTitle: Saisissez un nom pour le destinataire
    warningTitle: "Critères essentiels : {{count}}/{{total}}"
    infoTitle: "Critères vérifiés : {{count}}/{{total}}"
    successTitle: "Critères vérifiés : {{count}}/{{total}}"
    recipientCount: personne(s) enregistrée(s)
    warnings:
      unnamed: "dont {count} non nommée"
      unnamedPlural: "dont {count} non nommées"
      noContacts: "dont {count} sans coordonnées"
      noContactsAnd: "et {count} sans coordonnées"
    essentialNote: >-
      Ces critères sont le minimum pour assurer que les personnes 
      pourront se retrouver et accéder à votre secret.
    checklist:
      atLeast3: Au moins 3 personnes
      allNamed: Toutes ont un nom pour être identifiées
      allHaveContact: Toutes ont au moins une coordonnée
      atLeast5: Au moins 5 personnes
      allHaveAddress: Toutes ont une adresse postale
      allHaveEmail: Toutes ont une adresse email
      allHavePhone: Toutes ont un téléphone
    tip: >-
      Certaines coordonnées peuvent changer ou disparaître avec le temps. 
      Plus vous mettez d'information, plus vous faciliterez leur mise en relation.
    tip2: >-
      Préférez plus de personnes que pas assez, et pas que des personnes 
      qui vivent ensemble ou au même endroit, qu'on pourrait perdre en même temps.

securityWarning:
  title: Avertissement de sécurité
  subtitle: "Avant de continuer, veuillez confirmer les points suivants :"
  checkboxLabel: "J'ai téléchargé ce programme moi-même, récemment, directement depuis "
  checkboxLabelLink: github.com/edas/for-when-i-m-gone
  checkboxLabelEnd: "."
  continueButton: Continuer

secretEditor:
  title: Rédigez votre secret
  placeholder: Écrivez ici les informations que vous souhaitez transmettre...
  sidePanel:
    title: Éléments à inclure
    essentialNote: >-
      Les trois premiers éléments sont essentiels car ils donnent accès 
      aux procédures de récupération des comptes ainsi qu'aux seconds 
      facteurs d'authentification.
    collapse: Replier
    expand: Aide-mémoire
    errorTitle: Saisissez des secrets à transmettre
    warningTitle: "Informations essentielles : {{count}}/{{total}}"
    infoTitle: "Informations à vérifier : {{count}}/{{total}}"
    successTitle: "Informations vérifiées : {{count}}/{{total}}"
    checkboxes:
      emails: Adresses email et mots de passe correspondants
      phoneCodes: Codes de déverrouillage des téléphones et codes PIN des cartes SIM
      cloudAccounts: Identifiants et mots de passe Apple, Microsoft et/ou Google
      computerLogins: Identifiants et mots de passe de session des ordinateurs
      otherPasswords: Autres identifiants ou mots de passe habituels ou importants
      domainManager: Serveur, identifiant et mot de passe du gestionnaire de nom de domaine
      passwordManager: Serveur, identifiant et mot de passe du gestionnaire de mots de passe
      backups: Serveur, identifiant et mot de passe des sauvegardes
      crypto: Clés ou identifiants pour les crypto-monnaies
    sectionOptional: Si cela vous concerne
    generateExample: Générer un exemple
    # exampleContent est chargé depuis examples/secret-example.fr.txt

introEditor:
  title: Message d'introduction
  subtitle: Ce message accompagnera votre secret et expliquera son contexte
  placeholder: Écrivez ici votre message d'introduction...
  toolbar:
    insertRecipients: Insérer la liste des destinataires
    insertConditions: Insérer les conditions d'ouverture
    insertDateTime: Insérer la date du jour
    insertQuorum: Insérer le quorum requis
  sidePanel:
    title: Vérification du contenu
    intro: Ce message sera visible en clair, sans avoir besoin de déchiffrer quoi que ce soit. Il sert de guide pour aider les destinataires à comprendre le contexte et les démarches à suivre.
    collapse: Replier
    expand: Guide de rédaction
    essentialNote: >-
      Ces éléments sont essentiels pour que vos proches 
      sachent qui contacter et dans quelles circonstances.
    checkboxes:
      authorIdentity:
        title: Identité de l'auteur du message
        description: Votre nom complet pour que les destinataires sachent de qui provient ce message
      secretHolders:
        title: Liste des destinataires
        description: Noms et coordonnées complètes (téléphone, email, adresse postale, réseaux sociaux) des destinataires
      openingConditions:
        title: Conditions d'ouverture
        description: Les situations dans lesquelles le secret doit être ouvert (décès, incapacité, etc.) et celles où il ne doit PAS l'être (simple voyage, hospitalisation temporaire, etc.)
      dated:
        title: Message daté
        description: La date à laquelle vous avez écrit ce message
      quorum:
        title: Quorum précisé
        description: Le nombre de personnes qui doivent se réunir pour accéder au secret
      directives:
        title: Directives d'utilisation
        description: Instructions sur ce qu'il faut faire avec les informations contenues dans le secret
    warningTitle: "Éléments essentiels : {{count}}/{{total}}"
    infoTitle: "Éléments à vérifier : {{count}}/{{total}}"
    successTitle: "Éléments vérifiés : {{count}}/{{total}}"
    generateExample: Générer un exemple
    # exampleContent est chargé depuis examples/intro-example.fr.html
  buttons:
    continue: Continuer

howEditor:
  title: À quelles conditions accéder au secret ?
  threshold:
    title: Quorum requis
    subtitle: Combien de personnes doivent se réunir pour reconstituer le secret ?
    outOf: sur {{count}} destinataires
    errorOne: >-
      Si une seule personne suffit, transmettez simplement votre secret en clair, 
      sans utiliser ce programme.
  conditions:
    title: Comment et sous quelles conditions doivent-elles le faire ?
    placeholder: "Décrivez dans quels cas le secret doit être ouvert, et dans quels cas il ne doit PAS l'être.\n\nEx : En cas de décès ou d'incapacité prolongée, mais PAS en cas de simple voyage ou d'hospitalisation temporaire..."
  toolbar:
    heading: Titre
    bold: Gras
    italic: Italique
    underline: Souligné
    bulletList: Liste à puces
    numberedList: Liste numérotée
  sidePanel:
    title: Conditions d'accès
    collapse: Replier
    expand: Conseils
    intro: >-
      Définissez clairement les règles d'accès à votre secret pour éviter 
      les malentendus et les abus.
    errorTitle: Définissez des conditions d'accès valides
    notValidNumber: Saisissez un nombre de quorum valide
    oneRecipient: Le quorum doit être d'au moins 2
    lessThan2: Le quorum doit être d'au moins 2
    quorumTooHighTitle: Le quorum ne peut pas être supérieur au nombre de destinataires
    missingConditionsTitle: Définissez vos conditions d'ouverture
    warningTitle: "Critères essentiels : {{count}}/{{total}}"
    infoTitle: "Critères à vérifier : {{count}}/{{total}}"
    successTitle: "Critères vérifiés : {{count}}/{{total}}"
    essentialNote: >-
      Ces éléments sont essentiels pour garantir que votre secret 
      sera ouvert dans les bonnes circonstances.
    checklist:
      validThreshold: Quorum d'au moins 2
      hasConditions: Des conditions d'ouverture définies
      lowerThanRecipientCount: Quorum inférieur au nombre de destinataires
      lowerThanRecipientCountHelp: Pour permettre de perdre contact avec au moins un destinataire
      atLeast3: Quorum d'au moins 3
      atLeast3Help: Pour rendre plus difficile les manipulations
      atMost5: Quorum d'au plus 5
      atMost5Help: Sinon il devient difficile de le mettre en œuvre
      hasNoOpenConditions: Les conditions précisent les situations qui ne doivent pas mener à l'ouverture du secret
    tip: >-
      Les conditions d'ouverture seront communiquées dans le document. 
      Soyez précis et le plus exhaustif possible pour éviter les interprétations différentes.
    quorumWarning: >-
      Le quorum est le seul paramètre que vous ne pourrez pas changer sans casser la compatibilité avec des documents déjà envoyés. Réfléchissez-y bien.
    generateExample: Générer un exemple
    # exampleContent est chargé depuis examples/conditions-example.fr.html
  buttons:
    continue: Continuer

generateEditor:
  title: Générer les documents
  placeholder: Le contenu de cet écran sera défini prochainement.
  processing: Génération en cours...
  ready: Tout est prêt
  sidePanel:
    title: Génération
    intro: >-
      Cette étape permettra de générer les documents nécessaires 
      pour transmettre votre secret de manière sécurisée.
    collapse: Replier
    expand: Aide
  shares:
    title: Jetons partagés aux destinataires
    intro: >-
      Chaque destinataire a reçu un jeton unique. Ces jetons doivent être 
      combinés pour reconstituer la clé de déchiffrement. Transmettez chaque 
      jeton à son destinataire correspondant de manière sécurisée.
    copyButton: Copier
    unnamedRecipient: Personne non-nommée
  buttons:
    continueWithoutConfirm: Continuer sans confirmation
    continueWithoutEssentials: Continuer sans les essentiels
    continue: Continuer
