whoEditor:
  title: À qui destinez-vous ce secret ?
  newRecipient: Personne non-nommée
  addRecipient: Ajouter une personne
  removeRecipient: Retirer cette personne
  addContact: Ajouter une coordonnée
  removeContact: Retirer cette coordonnée
  buttons:
    continueWithoutConfirm: Continuer sans confirmation
    continueWithoutEssentials: Continuer sans les essentiels
    continue: Continuer
  fields:
    name: Qui est-ce ?
    contacts: Coordonnées
  placeholders:
    name: Cousin Paul Durant
    contactValue: Valeur...
    contactComment: Note...
  contactTypes:
    phone: Téléphone
    email: Email
    address: Adresse postale
    x: X (Twitter)
    bluesky: Bluesky
    mastodon: Mastodon
    facebook: Facebook
    telegram: Telegram
    whatsapp: WhatsApp
    signal: Signal
    instagram: Instagram
    snapchat: Snapchat
    linkedin: LinkedIn
    web: Site web
    other: Autre
  sidePanel:
    title: Les destinataires
    intro: >-
      Ces personnes recevront chacune une partie du secret. 
      Elles devront se réunir pour le reconstituer. 
      Ces renseignements leur permettront de savoir qui contacter et comment.
    collapse: Replier
    expand: Conseils
    recipientCount: personne(s) enregistrée(s)
    warnings:
      unnamed: "dont {count} non nommée"
      unnamedPlural: "dont {count} non nommées"
      noContacts: "dont {count} sans coordonnées"
      noContactsAnd: "et {count} sans coordonnées"
    essentialNote: >-
      Ces critères sont le minimum pour assurer que les personnes 
      pourront se retrouver et accéder à votre secret.
    checklist:
      atLeast3: Au moins 3 personnes
      allNamed: Toutes ont un nom pour être contactées
      allHaveContact: Toutes ont au moins une coordonnée
      atLeast5: Au moins 5 personnes
      allHaveAddress: Toutes ont une adresse postale
      allHaveEmail: Toutes ont une adresse email
      allHavePhone: Toutes ont un téléphone
    tip: >-
      Certaines coordonnées peuvent changer ou disparaître avec le temps. 
      Plus vous mettez d'information, plus vous faciliterez leur mise en relation.
    tip2: >-
      Préférez plus de personnes que pas assez, et pas que des personnes 
      qui vivent ensemble ou au même endroit, qu'on pourrait perdre en même temps.

