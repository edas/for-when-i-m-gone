secretEditor:
  title: Rédigez votre secret
  placeholder: Écrivez ici les informations que vous souhaitez transmettre...
  sidePanel:
    title: Éléments à inclure
    essentialNote: >-
      Les trois premiers éléments sont essentiels car ils donnent accès 
      aux procédures de récupération des comptes ainsi qu'aux seconds 
      facteurs d'authentification.
    collapse: Replier
    expand: Aide-mémoire
    checkboxes:
      emails: Adresses email et mots de passe correspondants
      phoneCodes: Codes de déverrouillage des téléphones et codes PIN des cartes SIM
      cloudAccounts: Identifiants et mots de passe Apple, Microsoft et/ou Google
      computerLogins: Identifiants et mots de passe de session des ordinateurs
      otherPasswords: Autres identifiants ou mots de passe habituels ou importants
      domainManager: Serveur, identifiant et mot de passe du gestionnaire de nom de domaine
      passwordManager: Serveur, identifiant et mot de passe du gestionnaire de mots de passe
      backups: Serveur, identifiant et mot de passe des sauvegardes
      crypto: Clés ou identifiants pour les crypto-monnaies
    sectionOptional: S'il y en a
    generateExample: Générer un exemple
    # exampleContent est chargé depuis examples/secret-example.fr.txt
  buttons:
    continueWithoutConfirm: Continuer sans confirmation
    continueWithoutEssentials: Continuer sans les essentiels
    continue: Continuer

introEditor:
  title: Message d'introduction
  subtitle: Ce message accompagnera votre secret et expliquera son contexte
  placeholder: Écrivez ici votre message d'introduction...
  toolbar:
    heading: Titre
    paragraph: Paragraphe
    bold: Gras
    italic: Italique
    underline: Souligné
    bulletList: Liste à puces
    numberedList: Liste numérotée
    insertRecipients: Insérer la liste des destinataires
    insertConditions: Insérer les conditions d'ouverture
  sidePanel:
    title: Vérification du contenu
    intro: Assurez-vous que votre message contient les informations essentielles pour que vos proches comprennent comment utiliser ce secret.
    collapse: Replier
    expand: Guide de rédaction
    essentialNote: >-
      Ces éléments sont essentiels pour que vos proches 
      sachent qui contacter et dans quelles circonstances.
    checkboxes:
      secretHolders:
        title: Liste des détenteurs du secret
        description: Noms et coordonnées complètes (téléphone, email, adresse postale, réseaux sociaux) des personnes qui détiennent une partie du secret
      openingConditions:
        title: Conditions d'ouverture
        description: Les situations dans lesquelles le secret doit être ouvert (décès, incapacité, etc.) et celles où il ne doit PAS l'être (simple voyage, hospitalisation temporaire, etc.)
      directives:
        title: Directives d'utilisation
        description: Instructions sur ce qu'il faut faire avec les informations contenues dans le secret
    tip: Ce message sera visible en clair, sans avoir besoin de déchiffrer quoi que ce soit. Il sert de guide pour aider les destinataires à comprendre le contexte et les démarches à suivre.
    generateExample: Générer un exemple
    # exampleContent est chargé depuis examples/intro-example.fr.html
  buttons:
    continueWithoutConfirm: Continuer sans confirmation
    continueWithoutEssentials: Continuer sans les essentiels
    continue: Continuer

howEditor:
  title: À quelles conditions accéder au secret ?
  threshold:
    title: Quorum requis
    subtitle: Combien de personnes doivent se réunir pour reconstituer le secret ?
    outOf: sur {count} destinataires
    errorOne: >-
      Si une seule personne suffit, transmettez simplement votre secret en clair, 
      sans utiliser ce programme.
  conditions:
    title: Conditions d'ouverture du secret
    placeholder: "Décrivez dans quels cas le secret doit être ouvert, et dans quels cas il ne doit PAS l'être.\n\nEx : En cas de décès ou d'incapacité prolongée, mais PAS en cas de simple voyage ou d'hospitalisation temporaire..."
  sidePanel:
    title: Conditions d'accès
    collapse: Replier
    expand: Conseils
    intro: >-
      Définissez clairement les règles d'accès à votre secret pour éviter 
      les malentendus et les abus.
    essentialNote: >-
      Ces éléments sont essentiels pour garantir que votre secret 
      sera ouvert dans les bonnes circonstances.
    checklist:
      validThreshold: Quorum d'au moins 2
      hasConditions: Des conditions d'ouverture définies
      lowerThanRecipientCount: Quorum inférieur au nombre de destinataires
      lowerThanRecipientCountHelp: Pour permettre de perdre contact avec au moins un destinataire
      atLeast3: Quorum d'au moins 3
      atLeast3Help: Pour rendre plus difficile les manipulations
      atMost5: Quorum d'au plus 5
      atMost5Help: Sinon il devient difficile de le mettre en œuvre
      hasNoOpenConditions: Les conditions précisent les situations qui ne doivent pas mener à l'ouverture du secret
    tip: >-
      Les conditions d'ouverture seront communiquées dans le document. 
      Soyez précis et le plus exhaustif possible pour éviter les interprétations différentes.
  buttons:
    continueWithoutEssentials: Continuer sans les essentiels
    continue: Continuer

thresholdSelector:
  title: Nombre de personnes requises
  subtitle: Combien de personnes doivent se réunir ensemble pour reconstituer le secret ?
  sidePanel:
    title: Choisir le bon nombre
    collapse: Replier
    expand: Conseils
    intro: >-
      Un nombre entre 3 et 4 est généralement un bon compromis entre sécurité et praticité.
    warningTooSmall:
      title: Pas trop petit
      text: >-
        Un nombre trop petit permet plus facilement à une ou plusieurs personnes malveillantes 
        d'accéder au secret. Il faut imaginer la confiance qu'on aura dans plusieurs années, 
        pas celle d'aujourd'hui. Parfois les personnes changent ou se déchirent. 
        Parfois elles sont manipulées ou trompées par des tiers.
    warningTooLarge:
      title: Ni trop grand
      text: >-
        Un trop grand nombre rend difficile la mise en œuvre de la récupération. 
        Il faut penser que certaines personnes auront peut-être disparu, ou certaines 
        relations seront rompues, ou simplement les contacts auront changé et les personnes 
        ne seront plus joignables. Il est donc probable qu'on veuille un nombre inférieur 
        au nombre de personnes qui seront destinataires d'une partie du secret.
  errorOne: >-
    Si une seule personne suffit, transmettez simplement votre secret en clair, 
    sans utiliser ce programme.
  continueButton: Continuer
