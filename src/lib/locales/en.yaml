  intro: Intro
  generate: Generate

whoEditor:
  title: Who will receive this secret?
  newRecipient: Unnamed person
  addRecipient: Add a person
  removeRecipient: Remove this person
  addContact: Add contact info
  removeContact: Remove this contact
  buttons:
    continueWithoutConfirm: Continue without confirmation
    continueWithoutEssentials: Continue without essentials
    continue: Continue
  fields:
    name: Who is this?
    contacts: Contact information
    notListedPublicly: Do not list publicly
  placeholders:
    name: Cousin Paul Smith
    contactValue: Value...
    contactComment: Note...
  contactTypes:
    phone: Phone
    email: Email
    address: Address
    x: X (Twitter)
    bluesky: Bluesky
    mastodon: Mastodon
    facebook: Facebook
    telegram: Telegram
    whatsapp: WhatsApp
    signal: Signal
    instagram: Instagram
    snapchat: Snapchat
    linkedin: LinkedIn
    web: Website
    other: Other
  sidePanel:
    title: The recipients
    intro: >-
      Each of these people will receive a part of the secret. 
      They will need to gather together to reconstruct it.
      This information will help them know who to contact and how.
    collapse: Collapse
    expand: Tips
    recipientCount: person(s) registered
    warnings:
      unnamed: "including {count} unnamed"
      unnamedPlural: "including {count} unnamed"
      noContacts: "including {count} without contact info"
      noContactsAnd: "and {count} without contact info"
    essentialNote: >-
      These criteria are the minimum to ensure that people 
      can find each other and access your secret.
    checklist:
      atLeast3: At least 3 people
      allNamed: All have a name to be contacted
      allHaveContact: All have at least one contact info
      atLeast5: At least 5 people
      allHaveAddress: All have a postal address
      allHaveEmail: All have an email address
      allHavePhone: All have a phone number
    tip: >-
      Some contact information may change or disappear over time. 
      The more information you provide, the easier it will be for them to connect.
    tip2: >-
      Prefer more people rather than too few, and not only people 
      who live together or in the same place, who could be lost at the same time.

securityWarning:
  title: Security Warning
  subtitle: "Before continuing, please confirm the following:"
  checkboxLabel: "I downloaded this program myself, recently, directly from "
  checkboxLabelLink: github.com/edas/for-when-i-m-gone
  checkboxLabelEnd: "."
  continueButton: Continue

secretEditor:
  title: Write your secret
  placeholder: Write here the information you wish to pass on...
  sidePanel:
    title: Elements to include
    essentialNote: >-
      The first three elements are essential because they provide access 
      to account recovery procedures and two-factor authentication.
    collapse: Collapse
    expand: Checklist
    checkboxes:
      emails: Email addresses and corresponding passwords
      phoneCodes: Phone unlock codes and SIM card PIN codes
      cloudAccounts: Apple, Microsoft and/or Google credentials
      computerLogins: Computer session usernames and passwords
      otherPasswords: Other common or important usernames or passwords
      domainManager: Server, username and password for domain name manager
      passwordManager: Server, username and password for password manager
      backups: Server, username and password for backups
      crypto: Cryptocurrency keys or identifiers
    sectionOptional: If applicable
    generateExample: Generate an example
    # exampleContent is loaded from examples/secret-example.en.txt
  buttons:
    continueWithoutConfirm: Continue without confirmation
    continueWithoutEssentials: Continue without essentials
    continue: Continue

introEditor:
  title: Introduction Message
  subtitle: This message will accompany your secret and explain its context
  placeholder: Write your introduction message here...
  toolbar:
    heading: Heading
    paragraph: Paragraph
    bold: Bold
    italic: Italic
    underline: Underline
    bulletList: Bullet list
    numberedList: Numbered list
    insertRecipients: Insert recipients list
    insertConditions: Insert opening conditions
    insertDateTime: Insert today's date
    insertQuorum: Insert required quorum
  sidePanel:
    title: Content Verification
    intro: This message will be visible in plain text, without needing to decrypt anything. It serves as a guide to help recipients understand the context and steps to follow.
    collapse: Collapse
    expand: Writing guide
    essentialNote: >-
      These elements are essential so your loved ones 
      know who to contact and under what circumstances.
    checkboxes:
      authorIdentity:
        title: Author identity
        description: Your full name so recipients know who this message is from
      secretHolders:
        title: List of secret holders
        description: Names and full contact details (phone, email, postal address, social media) of people who hold a part of the secret
      openingConditions:
        title: Opening conditions
        description: Situations in which the secret should be opened (death, incapacity, etc.) and those where it should NOT (simple travel, temporary hospitalization, etc.)
      dated:
        title: Dated message
        description: The date when you wrote this message
      quorum:
        title: Required quorum
        description: The number of people who must gather to access the secret
      directives:
        title: Usage directives
        description: Instructions on what to do with the information contained in the secret
    generateExample: Generate an example
    # exampleContent is loaded from examples/intro-example.en.html
  buttons:
    continueWithoutConfirm: Continue without confirmation
    continueWithoutEssentials: Continue without essentials
    continue: Continue

howEditor:
  title: Under what conditions can the secret be accessed?
  threshold:
    title: Required quorum
    subtitle: How many people must gather to reconstruct the secret?
    outOf: out of {count} recipients
    errorOne: >-
      If only one person is sufficient, simply transmit your secret in plain text, 
      without using this program.
  conditions:
    title: Conditions for opening the secret
    placeholder: "Describe when the secret should be opened, and when it should NOT be opened.\n\nE.g.: In case of death or prolonged incapacity, but NOT in case of simple travel or temporary hospitalization..."
  toolbar:
    bold: Bold
    italic: Italic
    underline: Underline
    bulletList: Bullet list
    numberedList: Numbered list
  sidePanel:
    title: Access conditions
    collapse: Collapse
    expand: Tips
    intro: >-
      Clearly define the rules for accessing your secret to prevent 
      misunderstandings and abuse.
    essentialNote: >-
      These elements are essential to ensure your secret 
      will be opened under the right circumstances.
    checklist:
      validThreshold: Quorum of at least 2
      hasConditions: Opening conditions defined
      lowerThanRecipientCount: Quorum lower than the number of recipients
      lowerThanRecipientCountHelp: To allow losing contact with at least one recipient
      atLeast3: Quorum of at least 3
      atLeast3Help: To make manipulations more difficult
      atMost5: Quorum of at most 5
      atMost5Help: Otherwise it becomes difficult to implement
      hasNoOpenConditions: The conditions specify situations that should not lead to opening the secret
    tip: >-
      These conditions will be visible to recipients in the introduction message. 
      Be precise to avoid different interpretations.
    generateExample: Generate an example
    # exampleContent is loaded from examples/conditions-example.en.html
  buttons:
    continueWithoutEssentials: Continue without essentials
    continue: Continue
