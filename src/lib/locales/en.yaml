common:
  back: Back

securityWarning:
  title: Security Warning
  subtitle: "Before continuing, please confirm the following:"
  checkboxLabel: "I downloaded this program myself, recently, directly from "
  checkboxLabelLink: github.com/edas/for-when-i-m-gone
  checkboxLabelEnd: "."
  continueButton: Continue

secretEditor:
  title: Write your secret
  placeholder: Write here the information you wish to pass on...
  sidePanel:
    title: Elements to include
    essentialNote: >-
      The first three elements are essential because they provide access 
      to account recovery procedures and two-factor authentication.
    collapse: Collapse
    expand: Checklist
    checkboxes:
      emails: Email addresses and corresponding passwords
      phoneCodes: Phone unlock codes and SIM card PIN codes
      cloudAccounts: Apple, Microsoft and/or Google credentials
      computerLogins: Computer session usernames and passwords
      otherPasswords: Other common or important usernames or passwords
      domainManager: Server, username and password for domain name manager
      passwordManager: Server, username and password for password manager
      backups: Server, username and password for backups
      crypto: Cryptocurrency keys or identifiers
    sectionOptional: If applicable
    generateExample: Generate an example
    # exampleContent is loaded from examples/secret-example.en.txt
  buttons:
    continueWithoutConfirm: Continue without confirming content
    continueWithoutEssentials: Continue without essentials
    continue: Continue

introEditor:
  title: Introduction Message
  subtitle: This message will accompany your secret and explain its context
  placeholder: Write your introduction message here...
  toolbar:
    heading: Heading
    paragraph: Paragraph
    bold: Bold
    italic: Italic
    underline: Underline
    bulletList: Bullet list
    numberedList: Numbered list
  sidePanel:
    title: Content Verification
    intro: Make sure your message contains essential information so your loved ones understand how to use this secret.
    collapse: Collapse
    expand: Writing guide
    essentialNote: >-
      The first three elements are essential so your loved ones 
      know who to contact and under what circumstances.
    checkboxes:
      secretHolders:
        title: List of secret holders
        description: Names and full contact details (phone, email, postal address, social media) of people who hold a part of the secret
      openCases:
        title: Opening cases
        description: Situations in which the secret should be opened (death, incapacity, etc.)
      noOpenCases:
        title: Non-opening cases
        description: Situations where the secret should NOT be opened (simple travel, temporary hospitalization, etc.)
      directives:
        title: Usage directives
        description: Instructions on what to do with the information contained in the secret
    tip: This message will be visible in plain text, without needing to decrypt anything. It serves as a guide to help recipients understand the context and steps to follow.
    generateExample: Generate an example
    # exampleContent is loaded from examples/intro-example.en.html
  buttons:
    continueWithoutConfirm: Continue without verifying
    continuePartial: Continue with partial verification
    continue: Continue
